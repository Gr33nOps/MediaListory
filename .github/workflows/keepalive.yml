name: Keep-Alive

# Neon auto-suspends an idle project and auto-resumes on the next connection, so a
# manual "unpause" is not needed. This lightweight check hits the app's /ready probe
# (which runs a query against Neon Postgres) a few times a week to keep the deployed
# service and database warm and to catch outages early.

on:
  schedule:
    - cron: "0 12 * * 1,3,5" # Mon, Wed, Fri at 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping /ready
    runs-on: ubuntu-latest
    steps:
      - name: Hit the readiness probe (exercises Neon Postgres)
        env:
          # Override in repo variables if the API host changes.
          READY_URL: ${{ vars.READY_URL || 'https://medialistory.onrender.com/ready' }}
        run: |
          set -euo pipefail
          echo "Pinging $READY_URL"
          set +e
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' --max-time 40 "$READY_URL")
          rc=$?
          set -e
          echo "curl exit: ${rc} | HTTP: ${code}"
          echo "Body: $(cat /tmp/body.txt 2>/dev/null || true)"
          if [ "${rc}" -ne 0 ] || [ "${code}" = "000" ]; then
            echo "::error::No response from the app (deploy may be down)."; exit 1
          fi
          if [ "${code}" -ge 500 ]; then
            echo "::error::App returned ${code}."; exit 1
          fi
          echo "App responded (${code}) - service and database are awake."
