name: E2E (Playwright)

# Post-deploy smoke tests against the live site. Runs on demand and daily —
# not on every push (Render deploys asynchronously, so a push-triggered run
# could hit the old build).
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target base URL'
        required: false
        default: 'https://medialistory.onrender.com'
  schedule:
    - cron: '0 12 * * *'   # daily 12:00 UTC

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Run tests
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://medialistory.onrender.com' }}
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
