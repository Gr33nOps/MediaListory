<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Following - MediaListory</title>
    <meta name="description" content="Track, rate, and share the movies, shows, anime, and games you love with MediaListory.">
    <meta name="robots" content="noindex,follow">
    <script>try{if(localStorage.getItem('theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
    <link rel="stylesheet" href="styles.css">
    <!-- seo:start -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="mask-icon" href="/favicon.svg" color="#3b82f6">
    <meta name="theme-color" content="#0b1220">
    <!-- seo:end -->
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="main-content" tabindex="-1" class="container">
        <!-- Navigation Bar -->
        <nav class="navbar" id="appNav" data-active="friends" data-brand="MediaListory" data-page-title="People" data-page-sub="Find people to follow, and see what they are watching and playing."></nav>
        <h1 class="sr-only">People</h1>

        <!-- Search Users Section -->
        <div class="search-container">
            <div class="search-bar">
                <label class="sr-only" for="userSearchInput">Search people by name</label>
                <input type="text" id="userSearchInput" class="search-input" placeholder="Search people by name..." aria-label="Search people">
                <button type="button" id="searchUsersBtn" class="btn btn-primary">Search</button>
            </div>
        </div>

        <!-- Search Results -->
        <div id="searchResults" class="friends-section hidden">
            <div class="list-header">
                <h2>Search results</h2>
            </div>
            <div id="userSearchResults" class="friends-list"></div>
        </div>

        <!-- Incoming follow requests (private accounts) -->
        <div id="requestsSection" class="friends-section" hidden>
            <div class="list-header">
                <h2>Follow requests</h2>
                <span id="requestsCount" class="friends-count"></span>
            </div>
            <div id="requestsList" class="friends-list"></div>
        </div>

        <!-- Recent activity from people you follow -->
        <div id="activitySection" class="friends-section" hidden>
            <div class="list-header">
                <h2>Recent activity</h2>
            </div>
            <div id="activityFeed" class="activity-feed"></div>
        </div>

        <!-- Following Section -->
        <div id="followingSection" class="friends-section" hidden>
            <div class="list-header">
                <h2>Following</h2>
                <span id="followingCount" class="friends-count">0 following</span>
            </div>
            <div id="followingList" class="friends-list"></div>
        </div>

        <!-- Discover people on the platform -->
        <div class="friends-section">
            <div class="list-header">
                <h2>Discover people</h2>
            </div>
            <div id="discoverList" class="friends-list"></div>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="friends.js"></script>
</body>
</html>
