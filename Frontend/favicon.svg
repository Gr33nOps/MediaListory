<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="MediaListory">
  <!-- Rounded dark card -->
  <rect x="2.5" y="2.5" width="27" height="27" rx="6.5" fill="#1b2333"/>
  <!-- Four list rows: a coloured dot + a rounded bar, in the category colours
       (Movies blue, Shows green, Anime pink, Games amber). -->
  <g>
    <circle cx="9" cy="8.7" r="2.1" fill="#5b9df9"/>
    <rect x="13.2" y="7.2" width="12.6" height="3" rx="1.5" fill="#5b9df9"/>
  </g>
  <g>
    <circle cx="9" cy="14" r="2.1" fill="#34cf9a"/>
    <rect x="13.2" y="12.5" width="10.4" height="3" rx="1.5" fill="#34cf9a"/>
  </g>
  <g>
    <circle cx="9" cy="19.3" r="2.1" fill="#ee6ca9"/>
    <rect x="13.2" y="17.8" width="8.6" height="3" rx="1.5" fill="#ee6ca9"/>
  </g>
  <g>
    <circle cx="9" cy="24.6" r="2.1" fill="#f6b52c"/>
    <rect x="13.2" y="23.1" width="7" height="3" rx="1.5" fill="#f6b52c"/>
  </g>
</svg>
