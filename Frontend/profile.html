<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>My profile - MediaListory</title>
    <meta name="description" content="Track, rate, and share the movies, shows, anime, and games you love with MediaListory.">
    <meta name="robots" content="noindex,follow">
    <script>try{if(localStorage.getItem('theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="styles.css">
    <!-- seo:start -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="mask-icon" href="/favicon.svg" color="#3b82f6">
    <meta name="theme-color" content="#0b1220">
    <!-- seo:end -->
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="main-content" tabindex="-1" class="container">
        <nav class="navbar" id="appNav" data-active="profile" data-brand="MediaListory" data-page-title="My Profile" data-page-sub="Your stats, activity, and account settings."></nav>
        <h1 class="sr-only">My profile</h1>

        <div class="profile-section">
            <div id="profileDisplay" class="profile-content">
                <div class="profile-avatar-section">
                    <div class="profile-avatar">
                        <img id="displayAvatar" src="" alt="Profile Avatar" onerror="this.src='https://ui-avatars.com/api/?name=User&size=200&background=3b82f6&color=fff&bold=true'">
                    </div>
                    <div class="profile-stats">
                        <div class="stat-item">
                            <span class="stat-value" id="userLevel">1</span>
                            <span class="stat-label">Level</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="followersCount">0</span>
                            <span class="stat-label">Followers</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="followingCount">0</span>
                            <span class="stat-label">Following</span>
                        </div>
                    </div>
                    <div id="mediaBreakdown" class="profile-media-breakdown" style="margin-top:10px;font-size:0.85rem;color:var(--text-muted);"></div>
                </div>

                <div class="profile-details">
                    <div class="detail-item">
                        <label>Display Name</label>
                        <div class="detail-value" id="displayName">-</div>
                    </div>
                    <div class="detail-item">
                        <label>Username</label>
                        <div class="detail-value" id="displayUsername">-</div>
                    </div>
                    <div class="detail-item">
                        <label>Email</label>
                        <div class="detail-value" id="displayEmail">-</div>
                    </div>
                    <div class="detail-item">
                        <label>Member Since</label>
                        <div class="detail-value" id="displayCreatedAt">-</div>
                    </div>
                </div>

                <div class="profile-actions">
                    <button id="editProfileBtn" class="btn btn-primary">Edit Profile</button>
                    <button id="changePasswordBtn" class="btn btn-secondary">Change Password</button>
                    <button id="importDataBtn" class="btn btn-secondary" type="button">Import a list</button>
                    <button id="exportDataBtn" class="btn btn-secondary" type="button">Export my data</button>
                </div>
            </div>

            <div id="profileEdit" class="profile-content hidden">
                <form id="editProfileForm">
                    <div class="edit-avatar-section">
                        <div class="profile-avatar">
                            <img id="editAvatarPreview" src="" alt="Profile Avatar" onerror="this.src='https://ui-avatars.com/api/?name=User&size=200&background=3b82f6&color=fff&bold=true'">
                        </div>
                        <div class="avatar-input-group">
                            <label>Profile picture</label>
                            <div id="avatarDrop" class="avatar-drop" tabindex="0" role="button" aria-label="Upload a profile picture">
                                <input type="file" id="avatarFile" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
                                <span class="avatar-drop-main">Drop an image here or <span class="avatar-drop-link">choose a file</span></span>
                                <small>Any photo from your device. It's cropped to a square and kept small.</small>
                            </div>
                            <button type="button" id="avatarClearBtn" class="link-btn" style="display:none;">Remove photo</button>
                            <input type="hidden" id="editAvatarData">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="editDisplayName">Display Name</label>
                        <input type="text" id="editDisplayName" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label for="editEmail">Email</label>
                        <input type="email" id="editEmail" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <div class="pv-toggle-row">
                            <div>
                                <div class="pv-toggle-title">Private account</div>
                                <div class="pv-toggle-sub">Only approved followers can see your library. New followers have to send a request.</div>
                            </div>
                            <label class="pv-switch">
                                <input type="checkbox" id="editPrivate">
                                <span class="pv-slider"></span>
                            </label>
                        </div>
                    </div>

                    <div id="editMessage"></div>

                    <div class="profile-actions">
                        <button type="submit" class="btn btn-success">Save Changes</button>
                        <button type="button" id="cancelEditBtn" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="passwordModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="passwordModalTitle">
            <div class="modal-content password-modal-content">
                <button type="button" class="close-btn" id="closePasswordModal" aria-label="Close">×</button>
                <h3 id="passwordModalTitle">Change Password</h3>
                <form id="changePasswordForm">
                    <div class="form-group">
                        <label for="currentPassword">Current Password</label>
                        <input type="password" id="currentPassword" class="form-input" required autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" class="form-input" required minlength="8" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <input type="password" id="confirmPassword" class="form-input" required minlength="8" autocomplete="new-password">
                    </div>
                    <div id="passwordMessage"></div>
                    <div class="modal-actions">
                        <button type="submit" class="btn btn-primary">Update Password</button>
                        <button type="button" id="cancelPasswordBtn" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="profile.js"></script>
    <script src="import.js"></script>
</body>
</html>
