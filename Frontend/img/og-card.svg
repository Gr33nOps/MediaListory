  <text x="240" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500" fill="#94a3b8">Track everything you watch and play, in one place</text>
  <g transform="translate(90 330)" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">
