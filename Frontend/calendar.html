<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Release Calendar - MediaListory</title>
    <meta name="description" content="Upcoming movies, shows, anime, and games — a release calendar with dates, grouped by month, plus what's coming on your own watchlist.">
    <meta name="robots" content="noindex,follow">
    <script>try{if(localStorage.getItem('theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
    <link rel="stylesheet" href="styles.css">
    <!-- seo:start -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="mask-icon" href="/favicon.svg" color="#3b82f6">
    <meta name="theme-color" content="#0b1220">
    <!-- seo:end -->
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="main-content" tabindex="-1" class="container">
        <nav class="navbar" id="appNav" data-active="" data-brand="MediaListory" data-page-title="Release Calendar" data-page-sub="What's coming out next, across everything you track."></nav>
        <h1 class="sr-only">Release calendar</h1>

        <div class="cal-filters" id="calFilters" role="tablist" aria-label="Filter by category">
            <button type="button" class="cal-chip active" data-cat="all" role="tab" aria-selected="true">All</button>
            <button type="button" class="cal-chip" data-cat="movie" role="tab" aria-selected="false">Movies</button>
            <button type="button" class="cal-chip" data-cat="series" role="tab" aria-selected="false">Shows</button>
            <button type="button" class="cal-chip" data-cat="anime" role="tab" aria-selected="false">Anime</button>
            <button type="button" class="cal-chip" data-cat="game" role="tab" aria-selected="false">Games</button>
        </div>

        <section id="calWatchlist" class="cal-watchlist" hidden></section>

        <div id="calBody">
            <div class="stats-loading">Checking release dates…</div>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="calendar.js"></script>
</body>
</html>
